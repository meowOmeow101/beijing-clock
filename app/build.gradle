plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// 签名配置：优先读取 keystore.properties（正式签名），缺省时回退到 debug 签名
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystorePropsFile.exists() && keystoreProps.getProperty('storeFile') != null

android {
    namespace 'com.beijing.clock'
    compileSdk 34
    buildToolsVersion = '34.0.0'

    defaultConfig {
        applicationId "com.beijing.clock"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "0.1"
        resConfigs "zh", "en"
    }

    if (hasReleaseKey) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources.excludes += ['META-INF/*.version', 'META-INF/DEPENDENCIES']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
